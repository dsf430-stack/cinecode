name: Cinecode cloud render verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloud-smoke.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CINECODE_BROWSER_TESTS: '1'
      CINECODE_NO_OPEN: '1'
      CINECODE_FRAME_TIMEOUT: '45'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          command -v google-chrome
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "CINECODE_SPARKS=$RUNNER_TEMP/cinecode-sparks.json" >> "$GITHUB_ENV"
          node -v
          python -V
          ffmpeg -version | head -n 1
          git rev-parse HEAD | tee evidence/commit.txt
      - name: Official tests including browser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee evidence/tests.log
      - name: Official starter render, picture and sound
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capture.mjs --url templates/quick/film.html --params 'w=270&h=480' --probe 2>&1 | tee evidence/probe.log
          node scripts/capture.mjs --url templates/quick/film.html --params 'w=270&h=480' --verify 2>&1 | tee evidence/determinism.log
          node scripts/capture.mjs --url templates/quick/film.html --params 'w=270&h=480' --video evidence/picture.mp4 --audio evidence/sound.wav --maxrate 4M 2>&1 | tee evidence/render.log
          ffmpeg -v error -i evidence/picture.mp4 -i evidence/sound.wav -c:v copy -c:a aac -shortest evidence/cinecode-cloud-smoke.mp4
          ffprobe -v error -show_format -show_streams -of json evidence/cinecode-cloud-smoke.mp4 > evidence/ffprobe.json
          ffmpeg -v error -i evidence/cinecode-cloud-smoke.mp4 -f null -
          python -c "import json; d=json.load(open('evidence/ffprobe.json')); assert {s['codec_type'] for s in d['streams']} >= {'video','audio'}; assert abs(float(d['format']['duration'])-8)<0.25"
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinecode-cloud-verification
          path: evidence/
          if-no-files-found: error
          retention-days: 7
